<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Desktop에서 시작(CLI)</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1d1d1f;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
  }

  h1 {
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 16px;
  }

  .subtitle {
    font-size: 14px;
    color: #777;
    margin: -4px 0 24px;
  }

  p {
    font-size: 16px;
    line-height: 1.6;
    color: #555;
    margin: 0 0 32px;
  }

  button {
    background: #1d1d1f;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:hover {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>이번 수정은 Claude Code CLI</h1>
    <p class="subtitle">DAY 12 - Claude Code for VS Code</p>
    <p>DAY 11 - VS Code 안에서 Claude Code CLI 실행 중</p>
    <p>같은 프로젝트를 Desktop과 CLI에서 번갈아 수정해보겠습니다.</p>
    <p>터미널 안에서 Claude에게 수정시켰습니다.</p>
    <button type="button">VS Code 확장에서 수정</button>
  </div>
</body>
</html>
