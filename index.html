<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강사 후보 관리</title>
<style>
  * { box-sizing: border-box; }
  :root {
    color: #1d1d1f;
    background: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body { margin: 0; min-height: 100vh; padding: 48px 20px; background: #f5f5f7; }
  .app { width: min(100%, 880px); margin: 0 auto; }
  .header { margin-bottom: 28px; }
  h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 38px); font-weight: 650; letter-spacing: -0.04em; }
  .subtitle { margin: 0; color: #777; font-size: 15px; }
  .form-card, .candidate-card {
    border: 1px solid #e5e5e7;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
  }
  .form-card {
    display: grid;
    grid-template-columns: repeat(3, 1fr) auto;
    gap: 14px;
    align-items: end;
    padding: 24px;
  }
  .field { display: grid; gap: 8px; }
  label { color: #555; font-size: 13px; font-weight: 600; }
  input {
    width: 100%;
    padding: 12px 13px;
    border: 1px solid #d6d6d8;
    border-radius: 9px;
    color: #1d1d1f;
    font: inherit;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: #1d1d1f; box-shadow: 0 0 0 3px rgba(29, 29, 31, 0.1); }
  button {
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    background: #1d1d1f;
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  button:hover { opacity: 0.85; }
  button:active { transform: translateY(1px); }
  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 36px 2px 14px;
  }

  .search-input {
    margin-bottom: 14px;
  }
  h2 { margin: 0; font-size: 18px; }
  .count { color: #777; font-size: 13px; }
  .candidate-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .candidate-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 20px;
  }
  .candidate-info { min-width: 0; }
  .candidate-name { margin: 0 0 5px; font-size: 17px; }
  .candidate-field { margin: 0 0 8px; color: #666; font-size: 13px; }
  .candidate-link {
    display: block;
    overflow: hidden;
    color: #555;
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .candidate-actions {
    display: grid;
    flex: 0 0 auto;
    gap: 8px;
  }

  .priority-select {
    min-width: 68px;
    padding: 8px 7px;
    border: 1px solid #d6d6d8;
    border-radius: 8px;
    background: #fff;
    color: #555;
    font: inherit;
    font-size: 12px;
  }
  .status-button { flex: 0 0 auto; min-width: 68px; padding: 9px 12px; background: #f0f0f2; color: #444; font-size: 12px; }
  .status-button.accepted { background: #e5f3e9; color: #23713b; }
  .status-button.rejected { background: #fbe8e8; color: #a33a3a; }
  .empty-state {
    grid-column: 1 / -1;
    margin: 0;
    padding: 42px 20px;
    border: 1px dashed #d6d6d8;
    border-radius: 16px;
    color: #888;
    font-size: 14px;
    text-align: center;
  }
  @media (max-width: 680px) {
    body { padding: 30px 16px; }
    .form-card, .candidate-list { grid-template-columns: 1fr; }
    .form-card { padding: 20px; }
    .candidate-card { padding: 18px; }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>강사 후보 관리</h1>
      <p class="subtitle">함께할 강사 후보를 한곳에서 관리해보세요.</p>
    </header>
    <form class="form-card" id="candidate-form">
      <div class="field">
        <label for="candidate-name">강사 이름</label>
        <input id="candidate-name" name="name" type="text" placeholder="예: 김민지" required>
      </div>
      <div class="field">
        <label for="candidate-field">분야</label>
        <input id="candidate-field" name="field" type="text" placeholder="예: 브랜딩" required>
      </div>
      <div class="field">
        <label for="candidate-sns">SNS 주소</label>
        <input id="candidate-sns" name="sns" type="url" placeholder="https://" required>
      </div>
      <button type="submit">후보 추가</button>
    </form>
    <div class="list-header">
      <h2>강사 후보</h2>
      <span class="count" id="candidate-count">0명</span>
    </div>
    <input class="search-input" id="candidate-search" type="search" placeholder="강사 이름이나 분야로 검색">
    <section class="candidate-list" id="candidate-list" aria-live="polite">
      <p class="empty-state" id="empty-state">아직 추가된 강사 후보가 없습니다.</p>
    </section>
  </main>
  <script>
    const form = document.querySelector('#candidate-form');
    const candidateList = document.querySelector('#candidate-list');
    const candidateCount = document.querySelector('#candidate-count');
    const searchInput = document.querySelector('#candidate-search');
    const emptyState = document.querySelector('#empty-state');
    const statuses = ['컨택중', '수락', '거절'];
    const priorities = ['낮음', '보통', '높음'];
    const candidates = JSON.parse(localStorage.getItem('instructor-candidates') || '[]');

    function saveCandidates() {
      localStorage.setItem('instructor-candidates', JSON.stringify(candidates));
    }

    function renderCandidates() {
      candidateList.replaceChildren();
      const searchTerm = searchInput.value.trim().toLowerCase();
      const filteredCandidates = candidates.filter((candidate) =>
        candidate.name.toLowerCase().includes(searchTerm) || candidate.field.toLowerCase().includes(searchTerm)
      );
      emptyState.hidden = filteredCandidates.length > 0;
      if (filteredCandidates.length === 0) {
        emptyState.textContent = candidates.length === 0
          ? '아직 추가된 강사 후보가 없습니다.'
          : '검색 결과가 없습니다.';
        candidateList.append(emptyState);
      }

      filteredCandidates.forEach((candidate) => {
        const card = document.createElement('article');
        card.className = 'candidate-card';
        const info = document.createElement('div');
        info.className = 'candidate-info';
        const name = document.createElement('h3');
        name.className = 'candidate-name';
        name.textContent = candidate.name;
        const field = document.createElement('p');
        field.className = 'candidate-field';
        field.textContent = candidate.field;
        const link = document.createElement('a');
        link.className = 'candidate-link';
        link.href = candidate.sns;
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.textContent = candidate.sns;
        const statusButton = document.createElement('button');
        statusButton.className = 'status-button';
        statusButton.type = 'button';
        statusButton.textContent = statuses[candidate.statusIndex];
        statusButton.addEventListener('click', () => {
          candidate.statusIndex = (candidate.statusIndex + 1) % statuses.length;
          saveCandidates();
          renderCandidates();
        });
        if (candidate.statusIndex === 1) statusButton.classList.add('accepted');
        if (candidate.statusIndex === 2) statusButton.classList.add('rejected');
        const actions = document.createElement('div');
        actions.className = 'candidate-actions';
        const prioritySelect = document.createElement('select');
        prioritySelect.className = 'priority-select';
        prioritySelect.setAttribute('aria-label', `${candidate.name} 우선순위`);
        priorities.forEach((priority, priorityIndex) => {
          const option = document.createElement('option');
          option.value = priorityIndex;
          option.textContent = priority;
          option.selected = candidate.priorityIndex === priorityIndex;
          prioritySelect.append(option);
        });
        prioritySelect.addEventListener('change', () => {
          candidate.priorityIndex = Number(prioritySelect.value);
          saveCandidates();
        });
        info.append(name, field, link);
        actions.append(prioritySelect, statusButton);
        card.append(info, actions);
        candidateList.append(card);
      });
      candidateCount.textContent = `${candidates.length}명`;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      candidates.push({
        name: formData.get('name').trim(),
        field: formData.get('field').trim(),
        sns: formData.get('sns').trim(),
        statusIndex: 0,
        priorityIndex: 1
      });
      saveCandidates();
      form.reset();
      document.querySelector('#candidate-name').focus();
      renderCandidates();
    });

    searchInput.addEventListener('input', renderCandidates);

    renderCandidates();
  </script>
</body>
</html>
